[project]
name = "amedia-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "python-dateutil",
    "matplotlib",
    "matplotlib-inline",
    "seaborn",
    "plotly",
    "adjustText",
    "openpyxl",
    "scikit-learn",
    "statsmodels",
    "scipy",
    "google-cloud-bigquery",
    "db-dtypes",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]